@if (!opened()) {
  <div class="landing-wrapper" [class.leaving]="leaving()" (click)="enter()" role="button" tabindex="0" (keydown.enter)="enter()" aria-label="Open wedding invitation">
    <app-landing />
  </div>
} @else {
  <app-audio-player />
  <div class="ambient-particles" aria-hidden="true">
    <span class="ap ap--1"></span>
    <span class="ap ap--2"></span>
    <span class="ap ap--3"></span>
    <span class="ap ap--4"></span>
    <span class="ap ap--5"></span>
    <span class="ap ap--6"></span>
    <span class="ap ap--7"></span>
    <span class="ap ap--8"></span>
    <span class="ap ap--9"></span>
    <span class="ap ap--10"></span>
    <span class="ap ap--11"></span>
    <span class="ap ap--12"></span>
  </div>
  <div class="main-content">
    <app-hero />
    <app-countdown />
    <app-story />
    <app-events />
    <app-footer />
  </div>
}
