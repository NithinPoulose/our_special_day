<section class="hero" aria-label="Wedding invitation">
  <!-- Animated bokeh lights -->
  <div class="bokeh-layer" aria-hidden="true">
    @for (b of bokeh; track b.id) {
      <span
        class="bokeh"
        [style.width.px]="b.size"
        [style.height.px]="b.size"
        [style.left.%]="b.left"
        [style.top.%]="b.top"
        [style.animation-delay.s]="b.delay"
        [style.animation-duration.s]="b.duration"
        [style.--start-op]="b.opacity"
        [style.--dx]="b.dx"
      ></span>
    }
  </div>

  <div class="hero-inner">
    <div class="hero-crest" aria-hidden="true">
      <img class="hero-crest__illustration"
           ngSrc="/files/line-drawing.svg"
           width="626"
           height="626"
           alt=""
           priority />
    </div>


    <p class="eyebrow section-eyebrow">Wedding Reception</p>

    <h1 class="names" aria-label="{{ config.groomName }} and {{ config.brideName }}">
      <span class="name">{{ config.groomName }}</span>
      <span class="amp" aria-hidden="true">Weds</span>
      <span class="name">{{ config.brideName }}</span>
    </h1>

    <p class="subheading">
      You are cordially invited to celebrate our wedding reception
    </p>

    <div class="ornament-divider divider" aria-hidden="true" style="color: var(--gold)">
      <span class="ornament-divider__line"></span>
      <span class="ornament-divider__diamond">◆</span>
      <span class="ornament-divider__line"></span>
    </div>

    <time class="date" [attr.datetime]="config.weddingDate.toISOString()">
      {{ config.weddingDateDisplay }}
    </time>
    <p class="location">{{ config.venue }}, {{ config.venueAddress }}</p>
  </div>

  <a class="scroll-cue" href="#countdown" aria-label="Scroll to see event details">
    <span class="scroll-cue__label">Scroll</span>
    <span class="scroll-cue__line" aria-hidden="true"></span>
  </a>
</section>
