<section class="hero" [attr.aria-label]="i18n.t().a11y.heroSection">
  <!-- Animated bokeh lights -->
  <div class="bokeh-layer" aria-hidden="true">
    @for (b of bokeh; track b.id) {
      <span
        class="bokeh"
        [style.width.px]="b.size"
        [style.height.px]="b.size"
        [style.left.%]="b.left"
        [style.top.%]="b.top"
        [style.animation-delay.s]="b.delay"
        [style.animation-duration.s]="b.duration"
        [style.--start-op]="b.opacity"
        [style.--dx]="b.dx"
      ></span>
    }
  </div>

  <div class="hero-inner">
    <div class="hero-crest" aria-hidden="true">
      <img class="hero-crest__illustration"
           ngSrc="/files/line-drawing.svg"
           width="626"
           height="626"
           alt=""
           priority />
    </div>


    <p class="eyebrow section-eyebrow">{{ i18n.t().hero.eyebrow }}</p>

    <h1 class="names" [attr.aria-label]="i18n.t().groomName + ' ' + i18n.t().hero.weds + ' ' + i18n.t().brideName">
      <span class="name">{{ i18n.t().groomName }}</span>
      <span class="amp" aria-hidden="true">{{ i18n.t().hero.weds }}</span>
      <span class="name">{{ i18n.t().brideName }}</span>
    </h1>

    <p class="subheading">
      {{ i18n.t().hero.subheading }}
    </p>

    <div class="ornament-divider divider" aria-hidden="true" style="color: var(--gold)">
      <span class="ornament-divider__line"></span>
      <span class="ornament-divider__diamond">◆</span>
      <span class="ornament-divider__line"></span>
    </div>

    <time class="date" [attr.datetime]="config.weddingDate.toISOString()">
      {{ i18n.t().weddingDateDisplay }}
    </time>
    <p class="location">{{ i18n.t().venue }}, {{ i18n.t().venueAddress }}</p>
  </div>

  <a class="scroll-cue" href="#countdown" [attr.aria-label]="i18n.t().a11y.scrollToDetails">
    <span class="scroll-cue__label">{{ i18n.t().hero.scroll }}</span>
    <span class="scroll-cue__line" aria-hidden="true"></span>
  </a>
</section>
